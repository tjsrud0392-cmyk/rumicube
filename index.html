<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>루미큐브 배우기 - 초등 튜토리얼</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    background:#eef1f6;color:#1c2430;font-size:16px;line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #dde2ea}
  .htop{display:flex;align-items:center;gap:10px;max-width:780px;margin:0 auto;padding:10px 14px}
  .htop .t{flex:1;min-width:0}
  .htop .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .htop .t span{font-size:12px;color:#68707d}
  .bar{height:6px;background:#e3e8f0}
  .bar i{display:block;height:100%;width:0;background:#2563eb;transition:width .3s ease}
  .wrap{max-width:780px;margin:0 auto;padding:14px 14px 130px}
  .card{background:#fff;border:1px solid #dde2ea;border-radius:16px;padding:18px;margin:0 0 14px}
  h2{font-size:22px;margin:0 0 10px;line-height:1.35}
  h3{font-size:17px;margin:18px 0 8px}
  p{margin:8px 0}
  ul{margin:8px 0;padding-left:20px}
  li{margin:6px 0}
  .lead{font-size:17px}
  .big{font-size:19px;font-weight:700}
  .muted{color:#68707d;font-size:14px}
  .tipbox{background:#f3f7ff;border:1px solid #cfe0ff;border-radius:12px;padding:12px 14px;margin:12px 0}
  .warnbox{background:#fff6f3;border:1px solid #ffd3c4;border-radius:12px;padding:12px 14px;margin:12px 0}
  .okbox{background:#f1fbf5;border:1px solid #bfe9cf;border-radius:12px;padding:12px 14px;margin:12px 0}
  .tipbox b,.warnbox b,.okbox b{display:block;margin-bottom:4px}

  /* tiles */
  .tile{
    width:46px;height:62px;border-radius:9px;background:#fdfcf5;
    border:1px solid #c7cdd8;border-bottom:3px solid #b9c0cc;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:800;font-size:25px;line-height:1;user-select:none;
    touch-action:manipulation;flex:0 0 auto;position:relative;transition:transform .12s ease
  }
  .tile.sm{width:36px;height:50px;font-size:20px;border-radius:7px}
  .tile.pick{cursor:pointer}
  .tile.sel{outline:3px solid #2563eb;outline-offset:1px;transform:translateY(-10px)}
  .tile.jk{font-size:26px;color:#1f2430}
  .tile.jk::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid #1f2430;opacity:.25}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .arrowdown{font-size:20px;color:#68707d;margin:6px 0 2px}

  .demo{border:1px solid #dde2ea;border-radius:12px;padding:12px;margin:12px 0;background:#fafbfd}
  .demo .lab{font-size:12px;color:#68707d;margin-bottom:6px}
  .sets{display:flex;flex-wrap:wrap;gap:10px}
  .set{display:flex;gap:4px;padding:7px;border:2px dashed #c7cdd8;border-radius:12px;background:#fff;align-items:center}
  .set.bad{border-color:#e0493b;background:#fff4f2}
  .set.good{border-color:#2aa36a;background:#f4fdf8}
  .set .addbtn{
    width:40px;height:62px;border-radius:9px;border:2px dashed #2563eb;background:#eff5ff;color:#2563eb;
    font-size:22px;font-weight:800;touch-action:manipulation
  }
  .newset{
    display:flex;align-items:center;justify-content:center;gap:6px;min-width:150px;height:78px;
    border:2px dashed #b9c0cc;border-radius:12px;color:#68707d;background:#fff;font-weight:700;font-size:14px;
    touch-action:manipulation;padding:0 12px
  }
  .newset.on{border-color:#2563eb;color:#2563eb;background:#eff5ff}

  .board{margin:14px 0 0}
  .zone{border:1px solid #dde2ea;border-radius:14px;padding:12px;margin:10px 0;background:#f7f9fc}
  .zone .zlab{font-size:13px;font-weight:800;color:#49525f;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .zone.rackzone{background:#fff7e9;border-color:#f0dcb8}
  .empty{color:#9aa3b0;font-size:14px;padding:10px 2px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{font-family:inherit}
  .btn{
    border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:800;
    background:#e6eaf1;color:#2b3340;touch-action:manipulation;min-height:48px
  }
  .btn.primary{background:#2563eb;color:#fff}
  .btn.green{background:#14875a;color:#fff}
  .btn.line{background:#fff;border:1px solid #c7cdd8}
  .btn:disabled{opacity:.45}
  .btn.small{padding:9px 12px;font-size:13px;min-height:40px}
  .fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:700;display:none}
  .fb.show{display:block}
  .fb.ok{background:#e9f8ef;color:#13643f;border:1px solid #bfe9cf}
  .fb.no{background:#fdeeeb;color:#9b2c1b;border:1px solid #ffd3c4}
  .fb.info{background:#eff5ff;color:#1b4ba8;border:1px solid #cfe0ff}
  .goal{background:#111827;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700}
  .goal span{display:block;font-size:12px;color:#aab4c4;font-weight:600;margin-bottom:2px}

  /* quiz */
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .choice{
    display:flex;align-items:center;gap:10px;border:2px solid #dde2ea;background:#fff;border-radius:14px;
    padding:12px;text-align:left;touch-action:manipulation;width:100%;font-size:15px;font-weight:700;color:#1c2430
  }
  .choice .ck{width:28px;height:28px;border-radius:50%;background:#eef1f6;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
  .choice.right{border-color:#2aa36a;background:#f4fdf8}
  .choice.wrong{border-color:#e0493b;background:#fff4f2}

  /* score table */
  table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
  th,td{border:1px solid #dde2ea;padding:8px 6px;text-align:right}
  th{background:#f3f6fb;text-align:center}
  td:first-child,th:first-child{text-align:left}
  tr.total td{font-weight:800;background:#fafbfd}
  .plus{color:#14875a}.minus{color:#c0392b}

  /* nav */
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde2ea;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .nav{max-width:780px;margin:0 auto;display:flex;gap:10px;padding:10px 14px}
  .nav .btn{flex:1}
  .skip{text-align:center;margin-top:10px}
  .skip button{background:none;border:0;color:#8a93a1;font-size:13px;text-decoration:underline;padding:8px}

  /* menu */
  .sheet{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:40;display:none}
  .sheet.on{display:block}
  .sheet .inner{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
  .sheet h4{margin:4px 0 10px;font-size:16px}
  .tocitem{display:flex;gap:10px;align-items:center;width:100%;border:0;background:#fff;border-bottom:1px solid #eef1f6;padding:13px 6px;text-align:left;font-size:15px;color:#1c2430;font-weight:600}
  .tocitem .num{width:26px;height:26px;border-radius:50%;background:#eef1f6;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800;color:#49525f}
  .tocitem.cur{color:#2563eb}
  .tocitem.cur .num{background:#2563eb;color:#fff}
  .tocitem.done .num{background:#14875a;color:#fff}

  .stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .stat{flex:1;min-width:92px;border:1px solid #dde2ea;border-radius:12px;padding:10px;background:#fff}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:#68707d}
  .cert{text-align:center;border:3px double #2563eb;border-radius:18px;padding:26px 16px;background:#fff}
  .cert .big{font-size:26px;margin:8px 0}
  @media (max-width:380px){
    .tile{width:40px;height:55px;font-size:22px}
    .set .addbtn{height:55px;width:36px}
    h2{font-size:20px}
  }
</style>
</head>
<body>
<header>
  <div class="htop">
    <button class="btn line small" id="menuBtn">목차</button>
    <div class="t"><b id="hTitle">루미큐브 배우기</b><span id="hSub">0 / 0 단계</span></div>
  </div>
  <div class="bar"><i id="pbar"></i></div>
</header>

<div class="wrap"><div id="app"></div></div>

<footer>
  <div class="nav">
    <button class="btn line" id="prevBtn">이전</button>
    <button class="btn primary" id="nextBtn">다음</button>
  </div>
</footer>

<div class="sheet" id="sheet"><div class="inner">
  <h4>목차</h4>
  <div id="toc"></div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn line" id="resetAll" style="flex:1">처음부터 다시</button>
    <button class="btn" id="closeSheet" style="flex:1">닫기</button>
  </div>
</div></div>

<script>
(function(){
"use strict";

/* ===================== 타일 기본 ===================== */
var COLOR = { b:"#1565c0", r:"#c62828", o:"#e08a00", k:"#1f2430" };
var COLORNAME = { b:"파랑", r:"빨강", o:"주황", k:"검정" };
var UID = 1;

function T(n, c){ return { id: UID++, n: n, c: c, j: false }; }
function JK(){ return { id: UID++, n: 0, c: "j", j: true }; }

/* "b3 b4 b5" -> 타일 배열 */
function parseTiles(str){
  var out = [];
  var parts = String(str).trim().split(/\s+/);
  for (var i = 0; i < parts.length; i++){
    var s = parts[i];
    if (!s) continue;
    if (s === "j"){ out.push(JK()); }
    else { out.push(T(parseInt(s.slice(1), 10), s.charAt(0))); }
  }
  return out;
}
/* "b3 b4 b5 | o8 r8 k8" -> 세트 배열 */
function parseSets(str){
  if (!String(str).trim()) return [];
  var chunks = String(str).split("|");
  var out = [];
  for (var i = 0; i < chunks.length; i++){
    if (chunks[i].trim()) out.push(parseTiles(chunks[i]));
  }
  return out;
}

function tileHTML(t, cls){
  var extra = cls ? (" " + cls) : "";
  if (t.j){
    return '<div class="tile jk' + extra + '" data-id="' + t.id + '">☺</div>';
  }
  return '<div class="tile' + extra + '" data-id="' + t.id + '" style="color:' + COLOR[t.c] + '">' + t.n + '</div>';
}
function rowHTML(tiles, cls){
  var h = "";
  for (var i = 0; i < tiles.length; i++) h += tileHTML(tiles[i], cls);
  return '<div class="row">' + h + "</div>";
}
function setsStaticHTML(str, cls){
  var sets = parseSets(str);
  var h = "";
  for (var i = 0; i < sets.length; i++){
    var inner = "";
    for (var k = 0; k < sets[i].length; k++) inner += tileHTML(sets[i][k], cls);
    h += '<div class="set">' + inner + "</div>";
  }
  return '<div class="sets">' + h + "</div>";
}

/* ===================== 세트 규칙 ===================== */
function validSet(ts){
  if (!ts || ts.length < 3) return false;
  var real = [], jk = 0, i;
  for (i = 0; i < ts.length; i++){ if (ts[i].j) jk++; else real.push(ts[i]); }
  if (real.length === 0) return false;

  /* 그룹: 같은 숫자, 색 모두 다름, 최대 4개 */
  var sameN = true;
  for (i = 0; i < real.length; i++) if (real[i].n !== real[0].n) sameN = false;
  if (sameN && ts.length <= 4){
    var cols = {}, dup = false;
    for (i = 0; i < real.length; i++){
      if (cols[real[i].c]) dup = true;
      cols[real[i].c] = 1;
    }
    if (!dup) return true;
  }

  /* 연속: 같은 색, 숫자가 이어짐 */
  var sameC = true;
  for (i = 0; i < real.length; i++) if (real[i].c !== real[0].c) sameC = false;
  if (sameC){
    var ns = [];
    for (i = 0; i < real.length; i++) ns.push(real[i].n);
    ns.sort(function(a,b){ return a-b; });
    var dup2 = false;
    for (i = 1; i < ns.length; i++) if (ns[i] === ns[i-1]) dup2 = true;
    if (!dup2){
      var span = ns[ns.length-1] - ns[0] + 1;
      var gaps = span - ns.length;
      if (gaps <= jk){
        var extra = jk - gaps;
        var lo = ns[0], hi = ns[ns.length-1];
        var room = (lo - 1) + (13 - hi);
        if (span <= 13 && extra <= room) return true;
      }
    }
  }
  return false;
}

function setValue(ts){
  var real = [], jk = 0, i;
  for (i = 0; i < ts.length; i++){ if (ts[i].j) jk++; else real.push(ts[i]); }
  if (!real.length) return 0;
  var sameN = true;
  for (i = 0; i < real.length; i++) if (real[i].n !== real[0].n) sameN = false;
  if (sameN) return real[0].n * ts.length;
  var ns = [];
  for (i = 0; i < real.length; i++) ns.push(real[i].n);
  ns.sort(function(a,b){ return a-b; });
  var lo = ns[0], hi = ns[ns.length-1], sum = 0;
  for (i = lo; i <= hi; i++) sum += i;
  var extra = jk - ((hi - lo + 1) - real.length);
  while (extra > 0){
    if (hi < 13){ hi++; sum += hi; }
    else if (lo > 1){ lo--; sum += lo; }
    else break;
    extra--;
  }
  return sum;
}

function tableValue(table){
  var s = 0;
  for (var i = 0; i < table.length; i++) s += setValue(table[i]);
  return s;
}

function displayOrder(ts){
  var real = [], jk = [], i;
  for (i = 0; i < ts.length; i++){ if (ts[i].j) jk.push(ts[i]); else real.push(ts[i]); }
  if (!real.length) return ts.slice();
  real.sort(function(a,b){ return a.n - b.n; });
  var sameN = true;
  for (i = 0; i < real.length; i++) if (real[i].n !== real[0].n) sameN = false;
  if (sameN) return real.concat(jk);
  var out = [], ji = 0;
  for (i = 0; i < real.length; i++){
    if (i > 0){
      var gap = real[i].n - real[i-1].n - 1;
      while (gap > 0 && ji < jk.length){ out.push(jk[ji++]); gap--; }
    }
    out.push(real[i]);
  }
  while (ji < jk.length) out.push(jk[ji++]);
  return out;
}

/* ===================== 보드 (실습 + 미니게임 공용) ===================== */
function makeBoard(host, cfg){
  var init = cfg.setup();
  var S = {
    rack: init.rack,
    table: init.table,
    sel: {},
    badIdx: -1,
    firstDone: cfg.mode === "game" ? false : true,
    pool: init.pool || [],
    turn: 1,
    snapRack: null,
    snapTable: null,
    finished: false
  };
  takeSnap();

  function takeSnap(){
    S.snapRack = S.rack.slice();
    S.snapTable = S.table.map(function(s){ return s.slice(); });
  }
  function selCount(){ var n = 0; for (var k in S.sel) if (S.sel[k]) n++; return n; }
  function clearSel(){ S.sel = {}; }

  function findTile(id){
    var i, k;
    for (i = 0; i < S.rack.length; i++) if (S.rack[i].id === id) return { where:"rack", si:-1, ti:i, t:S.rack[i] };
    for (i = 0; i < S.table.length; i++)
      for (k = 0; k < S.table[i].length; k++)
        if (S.table[i][k].id === id) return { where:"table", si:i, ti:k, t:S.table[i][k] };
    return null;
  }
  function pullSelected(){
    var ids = [], k;
    for (k in S.sel) if (S.sel[k]) ids.push(parseInt(k,10));
    var moved = [];
    for (var i = 0; i < ids.length; i++){
      var f = findTile(ids[i]);
      if (!f) continue;
      moved.push(f.t);
      if (f.where === "rack") S.rack.splice(f.ti,1);
      else S.table[f.si].splice(f.ti,1);
    }
    S.table = S.table.filter(function(s){ return s.length > 0; });
    clearSel();
    return moved;
  }

  function fbHTML(){ return '<div class="fb" id="fb-' + cfg.key + '"></div>'; }

  function say(type, msg){
    var el = host.querySelector(".fb");
    if (!el) return;
    el.className = "fb show " + type;
    el.innerHTML = msg;
  }
  function hideSay(){
    var el = host.querySelector(".fb");
    if (el) el.className = "fb";
  }

  function render(){
    var i, k, html = "";

    if (cfg.goal){
      html += '<div class="goal"><span>할 일</span>' + cfg.goal + "</div>";
    }

    if (cfg.mode === "game"){
      html += '<div class="stats">'
        + '<div class="stat"><b>' + S.rack.length + '</b><span>내 타일</span></div>'
        + '<div class="stat"><b>' + S.pool.length + '</b><span>풀에 남은 타일</span></div>'
        + '<div class="stat"><b>' + S.turn + '</b><span>차례</span></div>'
        + '<div class="stat"><b>' + (S.firstDone ? "완료" : "아직") + '</b><span>첫 등록(30점)</span></div>'
        + "</div>";
    }

    /* 테이블 */
    html += '<div class="zone"><div class="zlab"><span>테이블</span>';
    if (cfg.showSum) html += '<span>테이블 점수 ' + tableValue(S.table) + '점</span>';
    html += "</div>";
    html += '<div class="sets">';
    if (!S.table.length) html += '<div class="empty">아직 내려놓은 타일이 없어요.</div>';
    for (i = 0; i < S.table.length; i++){
      var cls = "set";
      if (S.badIdx === i) cls += " bad";
      html += '<div class="' + cls + '" data-set="' + i + '">';
      var ordered = displayOrder(S.table[i]);
      for (k = 0; k < ordered.length; k++){
        var t = ordered[k];
        var tc = cfg.allowTableMove ? "pick" : "";
        if (S.sel[t.id]) tc += " sel";
        html += tileHTML(t, tc);
      }
      if (selCount() > 0) html += '<button class="addbtn" data-addto="' + i + '">+</button>';
      html += "</div>";
    }
    html += '<button class="newset' + (selCount() > 0 ? " on" : "") + '" data-newset="1">＋ 새 세트로 내려놓기</button>';
    html += "</div></div>";

    /* 받침대 */
    html += '<div class="zone rackzone"><div class="zlab"><span>내 받침대</span>';
    if (cfg.mode === "game") html += '<button class="btn line small" data-sort="1">정렬</button>';
    html += "</div><div class=\"row\">";
    if (!S.rack.length) html += '<div class="empty">받침대가 비었어요!</div>';
    for (i = 0; i < S.rack.length; i++){
      html += tileHTML(S.rack[i], "pick" + (S.sel[S.rack[i].id] ? " sel" : ""));
    }
    html += "</div></div>";

    /* 버튼 */
    html += '<div class="acts">';
    if (cfg.mode === "game"){
      html += '<button class="btn green" data-act="check">내려놓기 확정</button>';
      html += '<button class="btn line" data-act="undo">되돌리기</button>';
      html += '<button class="btn" data-act="draw"' + (S.pool.length ? "" : " disabled") + '>타일 가져오기</button>';
      html += '<button class="btn line" data-act="newgame">새 게임</button>';
    } else {
      html += '<button class="btn green" data-act="check">확인하기</button>';
      html += '<button class="btn line" data-act="undo">처음으로</button>';
      if (cfg.hint) html += '<button class="btn line" data-act="hint">힌트</button>';
    }
    html += "</div>";
    html += '<div class="fb"></div>';

    host.innerHTML = '<div class="board">' + html + "</div>";
    bind();
  }

  function bind(){
    var tiles = host.querySelectorAll(".tile.pick");
    for (var i = 0; i < tiles.length; i++){
      tiles[i].addEventListener("click", function(){
        var id = parseInt(this.getAttribute("data-id"), 10);
        S.sel[id] = !S.sel[id];
        S.badIdx = -1;
        render();
      });
    }
    var adds = host.querySelectorAll("[data-addto]");
    for (var k = 0; k < adds.length; k++){
      adds[k].addEventListener("click", function(e){
        e.stopPropagation();
        var idx = parseInt(this.getAttribute("data-addto"), 10);
        var target = S.table[idx];
        var moved = pullSelected();
        var pos = S.table.indexOf(target);
        if (pos < 0){ S.table.push(moved); }
        else { S.table[pos] = S.table[pos].concat(moved); }
        S.badIdx = -1;
        hideSay(); render();
      });
    }
    var ns = host.querySelector("[data-newset]");
    if (ns) ns.addEventListener("click", function(){
      if (selCount() === 0){ say("info", "먼저 아래 받침대에서 타일을 눌러 고르세요."); return; }
      var moved = pullSelected();
      S.table.push(moved);
      S.badIdx = -1;
      hideSay(); render();
    });
    var sortBtn = host.querySelector("[data-sort]");
    if (sortBtn) sortBtn.addEventListener("click", function(){
      S.rack.sort(function(a,b){
        if (a.j) return 1;
        if (b.j) return -1;
        if (a.c !== b.c) return "brok".indexOf(a.c) - "brok".indexOf(b.c);
        return a.n - b.n;
      });
      render();
    });
    var acts = host.querySelectorAll("[data-act]");
    for (var m = 0; m < acts.length; m++){
      acts[m].addEventListener("click", function(){
        var a = this.getAttribute("data-act");
        if (a === "check") doCheck();
        else if (a === "undo") doUndo();
        else if (a === "draw") doDraw();
        else if (a === "hint"){ say("info", "힌트 - " + cfg.hint); }
        else if (a === "newgame"){ var fresh = cfg.setup(); S.rack = fresh.rack; S.table = fresh.table; S.pool = fresh.pool || []; S.turn = 1; S.firstDone = false; S.finished = false; clearSel(); takeSnap(); render(); }
      });
    }
  }

  function firstBadSet(){
    for (var i = 0; i < S.table.length; i++) if (!validSet(S.table[i])) return i;
    return -1;
  }

  function doUndo(){
    S.rack = S.snapRack.slice();
    S.table = S.snapTable.map(function(s){ return s.slice(); });
    clearSel(); S.badIdx = -1; hideSay(); render();
  }

  function doDraw(){
    doUndo();
    if (!S.pool.length) return;
    S.rack.push(S.pool.pop());
    S.turn++;
    takeSnap();
    render();
    say("info", "풀에서 타일 1개를 가져왔어요. 내 차례가 끝났습니다.");
  }

  function doCheck(){
    clearSel();
    var bad = firstBadSet();
    if (bad >= 0){
      S.badIdx = bad;
      render();
      say("no", "빨간 테두리 세트를 다시 보세요. 세트는 <b>같은 숫자 다른 색 3~4개</b>(그룹) 또는 <b>같은 색 이어지는 숫자 3개 이상</b>(연속)이어야 해요.");
      return;
    }
    S.badIdx = -1;

    if (cfg.mode === "game"){
      var playedCount = 0;
      var rackIds = {};
      for (var i = 0; i < S.rack.length; i++) rackIds[S.rack[i].id] = 1;
      for (var k = 0; k < S.snapRack.length; k++) if (!rackIds[S.snapRack[k].id]) playedCount++;
      if (playedCount === 0){
        render();
        say("no", "받침대에서 타일을 1개 이상 내려놓아야 해요. 내려놓을 게 없으면 <b>타일 가져오기</b>를 누르세요.");
        return;
      }
      if (!S.firstDone){
        var v = tableValue(S.table);
        if (v < 30){
          render();
          say("no", "첫 등록은 숫자의 합이 <b>30점 이상</b>이어야 해요. 지금은 " + v + "점입니다.");
          return;
        }
        S.firstDone = true;
      }
      S.turn++;
      takeSnap();
      if (!S.rack.length){
        S.finished = true;
        render();
        say("ok", "루미큐브! 타일을 모두 내려놓았어요. " + (S.turn - 1) + "번의 차례 만에 성공했습니다.");
        if (cfg.onPass) cfg.onPass();
        return;
      }
      render();
      say("ok", "좋아요! 규칙에 맞게 내려놓았습니다. 계속 해보세요.");
      return;
    }

    var res = cfg.check(S);
    render();
    if (res.ok){
      say("ok", res.msg);
      if (cfg.onPass) cfg.onPass();
    } else {
      say("no", res.msg);
    }
  }

  render();
  return { render: render };
}

  for (var i = 0; i < S.table.length; i++) if (!validSet(S.table[i])) return false;
  return S.table.length > 0;
}

/* ===================== 미니게임 ===================== */
function gameSetup(){
  var pool = [], c, n, rep;
  var cols = ["b","r","o","k"];
  for (rep = 0; rep < 2; rep++)
    for (c = 0; c < 4; c++)
      for (n = 1; n <= 13; n++) pool.push(T(n, cols[c]));
  pool.push(JK()); pool.push(JK());
  for (var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var rack = pool.splice(0, 14);
  rack.sort(function(a,b){
    if (a.j) return 1;
    if (b.j) return -1;
    if (a.c !== b.c) return "brok".indexOf(a.c) - "brok".indexOf(b.c);
    return a.n - b.n;
  });
  return { rack: rack, table: [], pool: pool };
}

/* ===================== 진행/렌더 ===================== */
var app = document.getElementById("app");
var hTitle = document.getElementById("hTitle");
var hSub = document.getElementById("hSub");
var pbar = document.getElementById("pbar");
var prevBtn = document.getElementById("prevBtn");
var nextBtn = document.getElementById("nextBtn");
var sheet = document.getElementById("sheet");
var toc = document.getElementById("toc");

var cur = 0;
var passed = [];
for (var z = 0; z < STEPS.length; z++) passed.push(false);

function load(){
  try {
    var v = localStorage.getItem("rk_step");
    if (v !== null){ cur = Math.min(parseInt(v,10) || 0, STEPS.length - 1); }
    var p = localStorage.getItem("rk_pass");
    if (p){
      var arr = JSON.parse(p);
      for (var i = 0; i < passed.length && i < arr.length; i++) passed[i] = !!arr[i];
    }
  } catch(e){}
}
function save(){
  try {
    localStorage.setItem("rk_step", String(cur));
    localStorage.setItem("rk_pass", JSON.stringify(passed));
  } catch(e){}
}

function needsPass(i){ return !!(STEPS[i].practice || STEPS[i].quiz); }

function updateNav(){
  prevBtn.disabled = (cur === 0);
  var last = (cur === STEPS.length - 1);
  nextBtn.textContent = last ? "처음으로" : "다음";
  nextBtn.disabled = (!last && needsPass(cur) && !passed[cur]);
}

function renderQuiz(mount, key){
  var q = QUIZ[key];
  var h = "<p class=\"big\">" + q.q + "</p><div class=\"choices\">";
  for (var i = 0; i < q.choices.length; i++){
    var c = q.choices[i];
    var body = c.tiles ? rowHTML(parseTiles(c.tiles), "sm") : ("<span>" + c.text + "</span>");
    h += '<button class="choice" data-i="' + i + '"><span class="ck">' + (i+1) + "</span>" + body + "</button>";
  }
  h += '</div><div class="fb"></div>';
  mount.innerHTML = h;
  var btns = mount.querySelectorAll(".choice");
  var fb = mount.querySelector(".fb");
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener("click", function(){
      var idx = parseInt(this.getAttribute("data-i"), 10);
      var right = q.choices[idx].ok;
      this.className = "choice " + (right ? "right" : "wrong");
      fb.className = "fb show " + (right ? "ok" : "no");
      fb.innerHTML = right ? ("정답입니다! " + q.explain) : "다시 한 번 생각해 볼까요?";
      if (right){
        for (var m = 0; m < btns.length; m++) btns[m].disabled = true;
        passed[cur] = true; save(); updateNav();
      }
    });
  }
}

function renderStep(){
  var st = STEPS[cur];
  hTitle.textContent = st.title;
  hSub.textContent = (cur + 1) + " / " + STEPS.length + " 단계";
  pbar.style.width = Math.round(((cur + 1) / STEPS.length) * 100) + "%";

  app.innerHTML = '<div class="card"><h2>' + st.title + "</h2>" + st.html + "</div>";

  var pm = app.querySelector("[data-practice]");
  if (pm){
    var key = pm.getAttribute("data-practice");
    var cfg = PRACTICE[key];
    makeBoard(pm, {
      key: key,
      goal: cfg.goal,
      hint: cfg.hint,
      showSum: cfg.showSum,
      allowTableMove: !!cfg.allowTableMove,
      mode: "practice",
      setup: cfg.setup,
      check: cfg.check,
      onPass: function(){ passed[cur] = true; save(); updateNav(); }
    });
    var sk = document.createElement("div");
    sk.className = "skip";
    sk.innerHTML = "<button>이 연습은 건너뛰기</button>";
    sk.querySelector("button").addEventListener("click", function(){
      passed[cur] = true; save(); updateNav();
      this.textContent = "건너뛰었어요. '다음'을 누르세요.";
    });
    pm.parentNode.appendChild(sk);
  }

  var qm = app.querySelector("[data-quiz]");
  if (qm) renderQuiz(qm, qm.getAttribute("data-quiz"));

  var gm = app.querySelector("[data-game]");
  if (gm){
    makeBoard(gm, {
      key: "game",
      goal: "받침대의 타일 14개를 모두 내려놓으세요.",
      mode: "game",
      allowTableMove: true,
      setup: gameSetup,
      check: function(){ return { ok:true, msg:"" }; }
    });
  }

  updateNav();
  window.scrollTo(0, 0);
  save();
}

function go(i){
  cur = Math.max(0, Math.min(i, STEPS.length - 1));
  renderStep();
}

prevBtn.addEventListener("click", function(){ go(cur - 1); });
nextBtn.addEventListener("click", function(){
  if (cur === STEPS.length - 1){ go(0); return; }
  passed[cur] = passed[cur] || !needsPass(cur);
  go(cur + 1);
});

document.getElementById("menuBtn").addEventListener("click", function(){
  var h = "";
  for (var i = 0; i < STEPS.length; i++){
    var cls = "tocitem" + (i === cur ? " cur" : (passed[i] ? " done" : ""));
    h += '<button class="' + cls + '" data-go="' + i + '"><span class="num">' + (i+1) + "</span><span>" + STEPS[i].title + "</span></button>";
  }
  toc.innerHTML = h;
  var items = toc.querySelectorAll("[data-go]");
  for (var k = 0; k < items.length; k++){
    items[k].addEventListener("click", function(){
      sheet.className = "sheet";
      go(parseInt(this.getAttribute("data-go"), 10));
    });
  }
  sheet.className = "sheet on";
});
document.getElementById("closeSheet").addEventListener("click", function(){ sheet.className = "sheet"; });
sheet.addEventListener("click", function(e){ if (e.target === sheet) sheet.className = "sheet"; });
document.getElementById("resetAll").addEventListener("click", function(){
  for (var i = 0; i < passed.length; i++) passed[i] = false;
  sheet.className = "sheet";
  go(0);
});

load();
renderStep();
})();
</script>
</body>
</html>
